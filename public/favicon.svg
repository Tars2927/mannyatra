<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8edf3"/>
      <stop offset="100%" style="stop-color:#d1d9e6"/>
    </linearGradient>
    <linearGradient id="needle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568"/>
      <stop offset="100%" style="stop-color:#2d3748"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="4" stdDeviation="8" flood-color="#a3b1c6" flood-opacity="0.5"/>
      <feDropShadow dx="-4" dy="-4" stdDeviation="8" flood-color="#ffffff" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Neumorphic circle background -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Compass outer ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#b8c4d4" stroke-width="3"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#c5cfd9" stroke-width="1.5"/>
  <!-- Cardinal points -->
  <text x="256" y="105" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="700" font-size="32" fill="#2d3748">N</text>
  <text x="256" y="430" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="600" font-size="28" fill="#718096">S</text>
  <text x="100" y="265" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="600" font-size="28" fill="#718096">W</text>
  <text x="412" y="265" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="600" font-size="28" fill="#718096">E</text>
  <!-- Tick marks -->
  <line x1="256" y1="82" x2="256" y2="98" stroke="#718096" stroke-width="2"/>
  <line x1="256" y1="414" x2="256" y2="430" stroke="#718096" stroke-width="2"/>
  <line x1="82" y1="256" x2="98" y2="256" stroke="#718096" stroke-width="2"/>
  <line x1="414" y1="256" x2="430" y2="256" stroke="#718096" stroke-width="2"/>
  <!-- Compass needle - North (dark) -->
  <polygon points="256,120 240,270 272,270" fill="url(#needle)" opacity="0.9"/>
  <!-- Compass needle - South (light) -->
  <polygon points="256,390 240,270 272,270" fill="#b8c4d4" opacity="0.7"/>
  <!-- Center dot -->
  <circle cx="256" cy="270" r="12" fill="#4a5568"/>
  <circle cx="256" cy="270" r="6" fill="#e8edf3"/>
</svg>
